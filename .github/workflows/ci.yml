name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  check:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - macos-14
          - windows-2022
    steps:
      - name: Check out source (actions/checkout v4.2.2)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install Node.js 22 (actions/setup-node v4.4.0)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Check formatting
        run: cargo fmt --check
      - name: Lint
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --locked --all
      - name: Check independent validator syntax
        run: node --check scripts/validate-bitwarden-output.mjs
      - name: Validate a generated nonzero-passkey export
        run: cargo test --locked --test cli independent_validator_checks_generated_nonzero_passkey -- --exact

  minimum-rust:
    name: Minimum Rust 1.88.0
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source (actions/checkout v4.2.2)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install declared minimum Rust
        run: rustup toolchain install 1.88.0 --profile minimal
      - name: Check all targets with the declared minimum Rust
        run: cargo +1.88.0 check --locked --all-targets --all-features

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source (actions/checkout v4.2.2)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Install cargo-audit 0.22.2
        run: cargo install cargo-audit --locked --version 0.22.2
      - name: Audit locked dependencies
        run: cargo audit --file Cargo.lock
      - name: Prove the ignored RSA package is unreachable
        shell: bash
        run: |
          set -euo pipefail
          rsa_tree="$(cargo tree --locked --target all -i rsa -e normal)"
          test -z "$rsa_tree"
